<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#121530" />
    <title>Page not found – Himanshu Yadav</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; --bg:#121530; --text:#ECEDF6; --muted:#A5AACB; --gold:#E9B949; font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg:#F3F4F8; --text:#121530; --muted:#535A7C; } }
      body { min-height: 100dvh; display: grid; place-items: center; margin: 0; background: var(--bg); color: var(--text); }
      main { width: min(620px, 100% - 40px); }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.05; letter-spacing: -.035em; }
      p { margin: 1rem 0 2rem; color: var(--muted); font-size: 1.15rem; line-height: 1.6; }
      a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 1.35rem; border-radius: 10px; background: var(--gold); color: #1A1404; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be old or mistyped. Everything else is on the home page.</p>
      <a href="/">Go to the home page</a>
    </main>
  </body>
</html>
